[tool.poetry]
name = "agentsec"
version = "1.0.0"
description = "Static security analysis for AI agent workflows"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "agentsec"}]

[tool.poetry.dependencies]
python = "^3.9"
pydantic = "^2.10.0"
typer = "^0.15.0"
jinja2 = "^3.1.4"
pyyaml = "^6.0.2"
pydot = "^3.0.0"
rich = {version = "^13.9.0", optional = true}
openai = {version = "^1.57.0", optional = true}
# Web dashboard
fastapi = {version = "^0.115.0", optional = true}
uvicorn = {version = "^0.32.0", optional = true}

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
black = ">=25.11.0"
ruff = "^0.8.0"
mypy = "^1.11.0"
httpx = "^0.27.0"  # for fastapi TestClient
pre-commit = "^3.5.0"

[tool.poetry.extras]
prompt-hardening = ["openai"]
rich-output = ["rich"]
server = ["fastapi", "uvicorn"]
all = ["openai", "rich", "fastapi", "uvicorn"]

[tool.poetry.scripts]
agentsec = "agentsec.cli.main:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py39']

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "agentsec.*"
ignore_missing_imports = true
